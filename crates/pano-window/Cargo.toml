[package]
name = "pano-window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pano 窗口服务：窗口生命周期、控制 API（全屏/置顶/显示器绑定/位置）、布局持久化（Tauri v2 实现）"

[features]
default = ["tauri"]
# Tauri v2 实现（WebviewWindow 封装）；关闭后可脱离 Tauri 编译（纯声明 + 测试）
tauri = ["dep:tauri"]

[dependencies]
pano-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
tauri = { workspace = true, optional = true }
