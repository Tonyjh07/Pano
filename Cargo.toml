[workspace]
resolver = "2"
members = [
    "crates/pano-core",
    "crates/pano-adapters",
    "crates/pano-window",
    "crates/pano-ui",
    "crates/pano-app",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tonyjh07/Pano"

[workspace.dependencies]
pano-core = { path = "crates/pano-core" }
# 关闭默认特性：feature 由 pano-app 透传控制（spec §5）
pano-adapters = { path = "crates/pano-adapters", default-features = false }
pano-window = { path = "crates/pano-window" }
pano-ui = { path = "crates/pano-ui" }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tauri = { version = "2" }
